<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - NIMBU ACTIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="topbar-home">Home</a>
    <a href="index.html" class="topbar-logo">
      <img src="png/logo.png" alt="NIMBU ACTIVE">
    </a>
    <a href="cart.html" class="topbar-cart">
      <img src="png/cart.png" alt="Cart">
    </a>
  </header>

  <div class="cart-container">
    <div class="cart-header">
      <div class="check-icon">✓</div>
      <h1 class="cart-title">THANK YOU FOR YOUR ORDER</h1>
    </div>

    <div class="cart-layout">
      <div class="cart-items-section">
        <h2 class="section-title">YOUR ITEMS</h2>
        <div id="cartItemsContainer">
          <div class="cart-item">
            <div class="item-details">
              <h3 class="item-name">No items yet</h3>
              <p class="item-price">Go add something to your cart!</p>
            </div>
          </div>
        </div>
      </div>

      <div class="cart-summary-section">
        <h2 class="section-title">ORDER DETAILS</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cartSubtotal">$0.0</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>FREE</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="cartTotal">$0.0</span>
        </div>
      </div>
    </div>

    <div class="free-shipping-bar">
      <p class="shipping-text">Free Shipping</p>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script src="logic.js"></script>
</body>
</html>
