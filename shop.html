<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - NIMBU ACTIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="topbar-home">Home</a>
    <a href="index.html" class="topbar-logo">
      <img src="png/logo.png" alt="NIMBU ACTIVE">
    </a>
    <a href="cart.html" class="topbar-cart">
      <img src="png/cart.png" alt="Cart">
    </a>
  </header>

  <div class="shop-container">
    
    <div class="sidebar-wrapper">
      <aside class="sidebar" id="shopSidebar">
        <h2 class="sidebar-title">CATEGORIES</h2>
        <ul class="category-list">
          <li><a href="#">Bodysuits</a></li>
          <li class="active"><a href="#">Leggings</a></li>
          <li><a href="#">Crop Tops</a></li>
          <li><a href="#">Sets</a></li>
          <li><a href="#">Accessories</a></li>
        </ul>
        <button class="btn-filter">APPLY FILTERS</button>
      </aside>
      <button class="toggle-sidebar-btn" id="toggleBtn" onclick="toggleSidebar()">←</button>
    </div>

    <main class="shop-main">
      <div class="shop-toolbar">
        <span class="product-count">4 Products</span>
        <select class="sort-select">
          <option>BEST SELLING</option>
          <option>PRICE: LOW TO HIGH</option>
          <option>PRICE: HIGH TO LOW</option>
        </select>
      </div>

      <div class="products-grid">
        <a href="product.html?id=1" class="product-card">
          <div class="product-image-wrapper">
            <img src="png/product1.png" alt="Belle Bodysuits" class="product-image">
            <span class="product-badge">Sale</span>
            <div class="quick-view">Quick View</div>
          </div>
          <div class="product-info">
            <h3 class="product-name">Belle Bodysuits</h3>
            <p class="product-price">$49.9</p>
          </div>
        </a>

        <a href="product.html?id=2" class="product-card">
          <div class="product-image-wrapper">
            <img src="png/product2.png" alt="Rainbow 2pc Legging & Crop Set" class="product-image">
            <span class="product-badge">Sale</span>
            <div class="quick-view">Quick View</div>
          </div>
          <div class="product-info">
            <h3 class="product-name">Rainbow 2pc Legging & Crop Set</h3>
            <p class="product-price">$49.9</p>
          </div>
        </a>

        <a href="product.html?id=3" class="product-card">
          <div class="product-image-wrapper">
            <img src="png/product3.png" alt="Cali 2pc Leggings & Crop" class="product-image">
            <span class="product-badge">Sale</span>
            <div class="quick-view">Quick View</div>
          </div>
          <div class="product-info">
            <h3 class="product-name">Cali 2pc Leggings & Crop</h3>
            <p class="product-price">$49.9</p>
          </div>
        </a>

        <div class="product-card sold-out-card">
          <div class="product-image-wrapper">
            <img src="png/soldout.png" alt="Neo - Active Bodysuit Black" class="product-image">
            <span class="product-badge badge-sold-out">Sold Out</span>
          </div>
          <div class="product-info">
            <h3 class="product-name">Neo - Active Bodysuit Black</h3>
            <p class="product-price sold-out-text">Sold Out</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="logic.js"></script>
</body>
</html>
